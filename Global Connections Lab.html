<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Connections: History Matching Lab</title><style>body{font:18px system-ui,sans-serif;background:#f2f5fa;color:#17243a;margin:0}main{max-width:900px;margin:auto;padding:24px}header,.panel{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 2px 9px #0001}button{font:inherit;padding:12px;border-radius:10px;border:2px solid #546f9d;background:white;cursor:pointer;text-align:left}button:focus-visible{outline:4px solid orange}button.selected{background:#d9eaff}button.matched{background:#d9f4df;border-color:#237b45}button:disabled{cursor:default} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.column{display:grid;gap:10px;align-content:start} .small{color:#46546b}#feedback{min-height:3em} .hidden{display:none} .primary{background:#183d78;color:white;text-align:center} @media(max-width:580px){.grid{grid-template-columns:1fr 1fr}main{padding:10px}button{font-size:15px;padding:9px}}</style></head><body><main><header><h1>Global Connections: History Matching Lab</h1><p>Learn how knowledge, ideas, and political changes moved across societies. Select one card on the left and its matching card on the right. Each match teaches you something new.</p><p id="progress" aria-live="polite"></p></header><section class="panel"><h2 id="level"></h2><p id="lesson"></p><div class="grid"><div class="column" id="left"></div><div class="column" id="right"></div></div><p id="feedback" role="status" aria-live="polite"></p><button id="next" class="primary hidden">Next level →</button></section></main><script>
const levels=[
{title:'Level 1: Global Knowledge Exchange',lesson:'Ideas do not develop in isolation. Trade, translation, migration, and conquest moved knowledge across Afro-Eurasia. Match each knowledge network with its historical contribution.',pairs:[['Abbasid translation movement','Scholars translated and studied Greek, Persian, and Indian works in Arabic, helping preserve and extend knowledge.','Translation centers in Baghdad supported scholarship across languages and intellectual traditions.'],['Indian mathematical traditions','The decimal place-value system and zero became foundational to mathematical work transmitted through Arabic scholarship.','The numeral system widely used today has important origins in South Asia.'],['Chinese papermaking','Paper-making techniques spread westward and made written knowledge easier to reproduce.','Paper traveled across regions before becoming widespread in Europe.'],['West African scholarly centers','Cities such as Timbuktu supported manuscript scholarship and intellectual exchange.','West African scholars contributed to networks of learning in law, theology, astronomy, and other subjects.']]},
{title:'Level 2: Renaissance',lesson:'European Renaissance scholars drew on classical texts, local innovations, and knowledge transmitted through Islamic and Byzantine networks. Match the exchange with its significance.',pairs:[['Arabic-to-Latin translations','Made scientific and philosophical works available to many European scholars.','Translations in places such as Toledo helped transmit and expand learning.'],['Ibn al-Haytham’s optics','Influenced later study of vision, light, and observation.','His research became part of a wider scientific tradition studied in Europe.'],['Byzantine Greek scholarship','Helped European humanists access and study Greek manuscripts.','Greek-speaking scholars and manuscripts contributed to Renaissance humanism.'],['Mediterranean trade networks','Moved goods, technologies, texts, and artistic ideas between regions.','Commercial and cultural contacts helped shape Renaissance environments.']]},
{title:'Level 3: Protestant Reformation',lesson:'The Reformation arose from European religious, political, and institutional conflicts. Earlier cross-cultural knowledge exchange shaped the wider intellectual world, but it is inaccurate to claim non-European societies directly caused Luther’s protest.',pairs:[['Indulgence controversy','Helped motivate Martin Luther’s public criticism of church practices.','Luther’s 1517 theses challenged the preaching and sale of indulgences.'],['Printing press','Accelerated circulation of Reformation arguments and responses.','Print enabled ideas to reach wider audiences more rapidly.'],['Scripture and religious authority','Became central subjects of debate among reformers and Catholic leaders.','Disagreements concerned who could interpret scripture and define doctrine.'],['Territorial rulers','Sometimes supported reform and reshaped church-state relationships.','Political protection and local power affected the spread of reform.']]},
{title:'Level 4: Enlightenment',lesson:'The Enlightenment emerged from many European debates and a longer history of global scientific and intellectual exchange. Match each connection with the careful historical interpretation.',pairs:[['Scientific Revolution','Helped establish methods of systematic observation and argument that influenced Enlightenment thinkers.','Scientific practices and philosophical debates were important intellectual contexts.'],['Global travel accounts','Provided European readers information—often biased or incomplete—about other societies.','Accounts of other societies could prompt comparisons of laws and customs.'],['Islamic philosophical scholarship','Contributed to the longer transmission and development of philosophy studied in Europe.','Medieval Arabic-language thinkers shaped intellectual traditions later encountered by Europeans.'],['Enlightenment political criticism','Questioned inherited authority and debated rights, government, and social order.','Enlightenment writers did not all agree about liberty, equality, or empire.']]},
{title:'Level 5: Historical Connections',lesson:'Now connect causes, processes, and consequences. Historical change usually has multiple causes: distinguish a documented influence from an overly simple explanation.',pairs:[['Translation and circulation of texts','Knowledge becomes accessible to new audiences who may reinterpret it.','Movement of texts can change intellectual debates without making every later event inevitable.'],['Trade across cultural boundaries','Goods and ideas spread through interactions among societies.','Exchange is multidirectional and can involve unequal power.'],['Criticism of religious institutions','Can contribute to changes in religious and political authority.','The Reformation had religious and political consequences that varied by region.'],['Claims of a single civilization inventing modernity','Oversimplify the shared, contested, and uneven history of innovation.','Historical explanations should consider multiple contributors and evidence.']]}];
let level=0,selected=null,done=new Set(),mistakes=0;const $=id=>document.getElementById(id);function render(){let data=levels[level];$('level').textContent=data.title;$('lesson').textContent=data.lesson;$('progress').textContent=`Level ${level+1} of ${levels.length} • ${done.size} of ${data.pairs.length} matches completed`;$('left').innerHTML='';$('right').innerHTML='';$('feedback').textContent='Select a concept, then select its matching explanation.';$('next').classList.add('hidden');selected=null;done=new Set();mistakes=0;let order=data.pairs.map((_,i)=>i).sort(()=>Math.random()-.5);data.pairs.forEach((p,i)=>{let b=document.createElement('button');b.textContent=p[0];b.dataset.id=i;b.onclick=()=>choose('left',i,b);$('left').appendChild(b)});order.forEach(i=>{let b=document.createElement('button');b.textContent=data.pairs[i][1];b.dataset.id=i;b.onclick=()=>choose('right',i,b);$('right').appendChild(b)})}function choose(side,id,button){if(done.has(id))return;if(!selected){selected={side,id,button};button.classList.add('selected');return}if(selected.side===side){selected.button.classList.remove('selected');selected={side,id,button};button.classList.add('selected');return}let old=selected;old.button.classList.remove('selected');selected=null;if(old.id===id){done.add(id);for(let el of document.querySelectorAll(`[data-id="${id}"]`)){el.classList.add('matched');el.disabled=true}$('feedback').textContent='✓ '+levels[level].pairs[id][2];$('progress').textContent=`Level ${level+1} of ${levels.length} • ${done.size} of ${levels[level].pairs.length} matches completed`;if(done.size===levels[level].pairs.length){$('next').classList.remove('hidden');$('next').textContent=level===levels.length-1?'Play again ↻':'Next level →';$('feedback').textContent+=' Level complete!'}}else{mistakes++;$('feedback').textContent='Try again. Read the descriptions and compare the historical relationships. You can retry as often as needed.'}}$('next').onclick=()=>{level=level===levels.length-1?0:level+1;render()};render();
</script></body></html>
